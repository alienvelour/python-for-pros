[project]
name = "release-tracker-11-deployment"
version = "0.1.0"
description = "A release tracking application to track Projects and Tasks"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "alembic>=1.18.4",
    "email-validator>=2.0.0",
    "fastapi[standard]>=0.115.0",
    "psycopg[binary]>=3.3.3",
    "pwdlib[argon2]>=0.3.0",
    "pyjwt>=2.9.0",
    "pydantic-settings>=2.14.0",
    "sqlmodel>=0.0.22",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "release_tracker"
module-root = "src"

[tool.fastapi]
entrypoint = "release_tracker.main:app"

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["tests"]
norecursedirs = ["_exercise"]

[tool.mypy]
python_version = "3.14"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_incomplete_defs = true
no_implicit_optional = true
exclude = [
    "^tests/",
    "^alembic/versions/",
    "^_exercise/",
]

[tool.coverage.run]
branch = true
source = ["release_tracker"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[dependency-groups]
dev = [
    "coverage>=7.8.0",
    "mypy>=1.15.0",
    "pytest>=9.0.3",
    "ruff>=0.11.0",
]
